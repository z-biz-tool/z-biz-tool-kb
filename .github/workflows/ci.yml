name: CI

# 原先只有 build.yml（`push: tags: v*` + 四平台 tauri build），推 main 完全不设门禁：
# 想确认一次"typecheck / 测试过不过"就得打个 tag，付四份打包的开销。
# 这里把廉价门禁拆出来每次 push / PR 跑；出包仍然只认 tag。
#
# 后端只排 ubuntu-22.04：本仓 src-tauri 里没有 cfg(windows)/cfg(unix) 分支，
# macOS 那条腿与本地开发环境重复，加上去只是多烧 runner。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同分支后一次推送取消前一次：多会话并行直推 main 时，不取消会次次占满 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: 前端 typecheck + 构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 本仓的 tests/*.test.ts 此前从来没进过 CI：仓库里有测试、package.json 里有
      # test 脚本，但这条流水线只跑 typecheck + build（Rust 那边有 cargo test，
      # 前端这边一个断言都没跑）。改了逻辑红了，CI 不会知道。
      # 放在 Build 之前：断言是秒级的，挂在构建后面等于白挂。
      - name: Unit tests
        run: npm test

      # dist 在 .gitignore 里，而 tauri::generate_context! 要读 frontendDist，
      # 所以任何 cargo 步骤之前必须先出一次前端。
      - name: Build frontend
        run: npm run build

  backend:
    name: Rust test + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # runner 上新版 token 会写坏 rust-toolchain 生成的 cargo config（与 build.yml 同一条 workaround）
      - name: Reset broken cargo config
        run: rm -f "$HOME/.cargo/config.toml"

      - name: Build frontend (for Tauri context)
        run: |
          npm ci
          npm run build

      - name: Tests
        working-directory: src-tauri
        # `-- --nocapture`：Rust 测试框架默认**吞掉通过用例的 stdout/stderr**
        # ⇒ 本仓「[LIVE] 跳过 minimax 真实 API 实测…」这类跳过标记在 CI 日志里
        # 看不见 ⇒ 「没跑」看着跟「跑过了」一样。打开捕获后可核对。
        run: cargo test -- --nocapture

      - name: Clippy
        # 2026-10-21 收严：原来这条是「advisory」（不带 -D warnings），注释写着
        # 「跑出干净结果后再收严」—— 本地实测 `cargo clippy --all-targets -- -D warnings`
        # 已经是干净的（rc=0），所以按它自己写的计划收严。
        # 收严之后它才是门禁：warning 不再是「跑过就算」而是「挡住」。
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        # 新增门禁：rustfmt 差异之前只在本机量得到（2026-10-21 实测本仓有 35 处差异），
        # CI 完全不跑 ⇒ 谁改乱了格式没人知道，评审也只能靠肉眼。
        # 格式债已在同一次提交里整仓清零（纯排版，测试全过）。
        working-directory: src-tauri
        run: cargo fmt --all --check
